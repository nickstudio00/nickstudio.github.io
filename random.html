<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>광물 뽑기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #4f7cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #315fe0;
        }

        #result {
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 600px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .result-item {
            padding: 4px 0;
        }

        .summary {
            margin-top: 25px;
        }

        .summary-item {
            padding: 10px;
            margin: 7px 0;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 25px 0;
        }
    </style>
</head>

<body>

    <h1>광물 뽑기</h1>

    <button onclick="draw(1)">1회 뽑</button>
    <button onclick="draw(10)">10회 뽑</button>
    <button onclick="draw(20)">20회 뽑</button>
    <button onclick="draw(30)">30회 뽑</button>
    <button onclick="draw(31)">31회 뽑</button>

    <div id="result">
        결과가 여기에 표시됩니다.
    </div>


    <script>

        // =====================================
        // 확률 설정
        // 확률이 높은 순서로 자동 정렬됩니다.
        // =====================================

        const probabilities = [
            { name: "꽝", probability: 10.85 },
            { name: "청동", probability: 3.5 },
            { name: "은", probability: 3.5 },
            { name: "플래티넘(백금)", probability: 2.5 },
            { name: "사파이어", probability: 1.8 },
            { name: "에메랄드", probability: 1 },
            { name: "다이아몬드", probability: 0.8 },
            { name: "아다만티움", probability: 0.5 },
            { name: "비브라늄", probability: 0.25 },
            { name: "타이타늄", probability: 0.15 },
            { name: "페인나이트", probability: 0.10 },
            { name: "플래티넘 다이아몬드", probability: 0.05 },
            { name: "석탄", probability: 75 }
        ];


        // =====================================
        // 확률 높은 순서로 정렬
        // =====================================

        probabilities.sort(
            (a, b) => b.probability - a.probability
        );


        // =====================================
        // 확률 합계
        // =====================================

        const totalProbability = probabilities.reduce(
            (sum, item) => sum + item.probability,
            0
        );

        const roundedTotal =
            Math.round(totalProbability * 100) / 100;


        // =====================================
        // 확률 검사
        // =====================================

        if (Math.abs(roundedTotal - 100) > 0.000001) {

            document.getElementById("result").innerHTML = `
                <div class="error">
                    확률의 합이 ${roundedTotal}%입니다.<br>
                    확률의 합을 정확히 100%로 만들어주세요.
                </div>
            `;
        }


        // =====================================
        // 랜덤 뽑기
        // =====================================

        function randomResult() {

            let random = Math.random() * 100;

            for (const item of probabilities) {

                random -= item.probability;

                if (random < 0) {
                    return item.name;
                }
            }

            // 부동소수점 오차 방지
            return probabilities[probabilities.length - 1].name;
        }


        // =====================================
        // 뽑기
        // =====================================

        function draw(count) {

            if (Math.abs(roundedTotal - 100) > 0.000001) {

                alert(
                    `현재 확률의 합은 ${roundedTotal}%입니다.\n` +
                    `확률의 합이 100%가 되어야 합니다.`
                );

                return;
            }


            // 결과 저장
            const results = [];


            for (let i = 0; i < count; i++) {
                results.push(randomResult());
            }


            // =================================
            // 뽑기 결과
            // =================================

            let resultHTML = `
                <h2>${count}회 뽑기 결과</h2>
            `;


            results.forEach((result, index) => {

                resultHTML += `
                    <div class="result-item">
                        ${index + 1}. ${result}
                    </div>
                `;
            });


            // =================================
            // 획득 개수 계산
            // =================================

            const counts = {};

            probabilities.forEach(item => {
                counts[item.name] = 0;
            });

            results.forEach(result => {
                counts[result]++;
            });


            // =================================
            // 결과 요약
            // =================================

            resultHTML += `
                <div class="summary">
                    <hr>
                    <h2>결과 요약</h2>
            `;


            // 확률 높은 순서대로 확인
            probabilities.forEach(item => {

                const count = counts[item.name];

                // 한 번도 나오지 않은 광물은 표시하지 않음
                if (count === 0) {
                    return;
                }

                const percentage =
                    (count / results.length * 100).toFixed(2);


                resultHTML += `
                    <div class="summary-item">
                        <b>${item.name}</b><br>
                        획득: ${count}개 (${percentage}%)<br>
                        설정 확률: ${item.probability.toFixed(2)}%
                    </div>
                `;
            });


            resultHTML += `</div>`;


            document.getElementById("result").innerHTML =
                resultHTML;
        }

    </script>

</body>
</html>
